<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Tracker - OpporTune</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .kanban-board {
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            padding-bottom: 2rem;
            min-height: 60vh;
        }
        .kanban-column {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            width: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .kanban-header {
            padding: 1rem;
            border-bottom: 1px solid var(--glass-border);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .kanban-cards {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .kanban-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .kanban-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
        }
        select.status-select {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            color: white;
            padding: 0.2rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            width: 100%;
        }
        /* Custom scrollbar for kanban */
        .kanban-board::-webkit-scrollbar { height: 8px; }
        .kanban-board::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        .kanban-board::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a href="dashboard.html" class="logo">
                <i class="fas fa-radar text-gradient"></i>
                <span>OpporTune</span>
            </a>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="discover.html" class="sidebar-link">
                    <i class="fas fa-search"></i> Discover
                </a>
                <a href="roadmap.html" class="sidebar-link">
                    <i class="fas fa-map-signs"></i> My Roadmap
                </a>
                <a href="tracker.html" class="sidebar-link active">
                    <i class="fas fa-tasks"></i> Tracker
                </a>
                <a href="profile.html" class="sidebar-link">
                    <i class="fas fa-user"></i> Profile
                </a>
            </nav>
            <button onclick="logout()" class="btn btn-outline w-full mt-4">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </aside>

        <main class="main-content">
            <header class="mb-8">
                <h1 class="text-3xl">Application Tracker</h1>
                <p class="text-muted mt-2">Track your saved opportunities and application statuses.</p>
            </header>

            <div class="kanban-board" id="kanbanBoard">
                <div class="loading-container" style="width: 100%"><div class="loader"></div></div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        const columns = [
            { id: 'saved', title: 'Saved', icon: 'fa-bookmark', color: '#94a3b8' },
            { id: 'planning', title: 'Planning to Apply', icon: 'fa-calendar-alt', color: '#3b82f6' },
            { id: 'applied', title: 'Applied', icon: 'fa-paper-plane', color: '#8b5cf6' },
            { id: 'shortlisted', title: 'Shortlisted', icon: 'fa-star', color: '#f59e0b' },
            { id: 'selected', title: 'Selected', icon: 'fa-trophy', color: '#10b981' },
            { id: 'rejected', title: 'Rejected', icon: 'fa-times-circle', color: '#ef4444' }
        ];

        async function loadTracker() {
            try {
                const [apps, opps] = await Promise.all([
                    api.getApplications(),
                    api.getOpportunities() // Need this to get details for applications
                ]);

                // Map opp details to apps
                const enrichedApps = apps.map(app => {
                    const opp = opps.find(o => o.id === app.opportunity_id);
                    return { ...app, opportunity: opp || { title: 'Unknown', organization: 'Unknown' } };
                });

                const board = document.getElementById('kanbanBoard');
                board.innerHTML = columns.map(col => {
                    const colApps = enrichedApps.filter(a => a.status === col.id);
                    return `
                        <div class="kanban-column">
                            <div class="kanban-header" style="border-bottom-color: ${col.color}">
                                <span><i class="fas ${col.icon}" style="color: ${col.color}"></i> ${col.title}</span>
                                <span class="badge badge-outline">${colApps.length}</span>
                            </div>
                            <div class="kanban-cards">
                                ${colApps.map(app => `
                                    <div class="kanban-card">
                                        <h4 class="font-bold text-sm mb-1"><a href="opportunity-details.html?id=${app.opportunity_id}">${app.opportunity.title}</a></h4>
                                        <p class="text-xs text-muted mb-2">${app.opportunity.organization}</p>
                                        <select class="status-select" onchange="updateAppStatus(${app.opportunity_id}, this.value)">
                                            ${columns.map(c => `<option value="${c.id}" ${c.id === app.status ? 'selected' : ''}>Move to: ${c.title}</option>`).join('')}
                                        </select>
                                    </div>
                                `).join('')}
                                ${colApps.length === 0 ? '<p class="text-muted text-xs text-center py-4">No items</p>' : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                document.getElementById('kanbanBoard').innerHTML = `<p class="text-red-500">Error loading tracker: ${error.message}</p>`;
            }
        }

        async function updateAppStatus(oppId, newStatus) {
            try {
                await api.updateApplicationStatus(oppId, { status: newStatus });
                showToast('Status updated');
                loadTracker(); // Reload board
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadTracker);
    </script>
</body>
</html>
