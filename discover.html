<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover - OpporTune</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .filters-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .filter-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            outline: none;
        }
        .filter-input:focus {
            border-color: var(--primary);
        }
        .opps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        .match-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--match-high);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-weight: bold;
            font-size: 0.875rem;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a href="dashboard.html" class="logo">
                <i class="fas fa-radar text-gradient"></i>
                <span>OpporTune</span>
            </a>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="discover.html" class="sidebar-link active">
                    <i class="fas fa-search"></i> Discover
                </a>
                <a href="roadmap.html" class="sidebar-link">
                    <i class="fas fa-map-signs"></i> My Roadmap
                </a>
                <a href="tracker.html" class="sidebar-link">
                    <i class="fas fa-tasks"></i> Tracker
                </a>
                <a href="profile.html" class="sidebar-link">
                    <i class="fas fa-user"></i> Profile
                </a>
            </nav>
            <button onclick="logout()" class="btn btn-outline w-full mt-4">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </aside>

        <main class="main-content">
            <header class="mb-6">
                <h1 class="text-3xl">Discover Opportunities</h1>
                <p class="text-muted mt-2">Find the perfect internships, hackathons, and more, ranked by how well they match your profile.</p>
            </header>

            <div class="filters-bar">
                <input type="text" id="searchInput" class="filter-input" placeholder="Search title..." style="flex: 1; min-width: 200px;">
                <select id="categoryFilter" class="filter-input">
                    <option value="">All Categories</option>
                    <option value="Internship">Internships</option>
                    <option value="Hackathon">Hackathons</option>
                    <option value="Scholarship">Scholarships</option>
                    <option value="Course">Courses</option>
                    <option value="Competition">Competitions</option>
                    <option value="Workshop">Workshops</option>
                </select>
                <select id="modeFilter" class="filter-input">
                    <option value="">All Modes</option>
                    <option value="Remote">Remote</option>
                    <option value="Hybrid">Hybrid</option>
                    <option value="On-site">On-site</option>
                </select>
                <button id="searchBtn" class="btn btn-primary"><i class="fas fa-search"></i> Filter</button>
            </div>

            <div id="oppsGrid" class="opps-grid">
                <div class="loading-container" style="grid-column: 1 / -1;"><div class="loader"></div></div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function loadOpportunities() {
            const container = document.getElementById('oppsGrid');
            container.innerHTML = '<div class="loading-container" style="grid-column: 1 / -1;"><div class="loader"></div></div>';
            
            const params = {};
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const mode = document.getElementById('modeFilter').value;
            
            if (search) params.search = search;
            if (category) params.category = category;
            if (mode) params.mode = mode;

            try {
                const opps = await api.getOpportunities(params);
                if (opps.length === 0) {
                    container.innerHTML = '<p class="text-muted" style="grid-column: 1/-1">No opportunities found matching your criteria.</p>';
                    return;
                }

                container.innerHTML = opps.map(opp => `
                    <div class="glass-card flex flex-col justify-between" style="display: flex; flex-direction: column;">
                        <div>
                            <div class="card-header">
                                <span class="badge badge-outline">${opp.category}</span>
                                <div class="match-badge" style="color: var(--${getMatchColor(opp.match_score)}); border-color: var(--${getMatchColor(opp.match_score)})">${opp.match_score}% Match</div>
                            </div>
                            <h3 class="text-xl mb-1">${opp.title}</h3>
                            <p class="text-muted text-sm mb-4"><i class="fas fa-building mr-1"></i> ${opp.organization}</p>
                            
                            <div class="mb-4">
                                ${getPriorityBadge(opp.priority)}
                                ${opp.days_remaining !== null ? `<span class="badge badge-outline ml-2"><i class="far fa-clock mr-1"></i> ${opp.days_remaining}d left</span>` : ''}
                            </div>
                            
                            <p class="text-sm text-muted line-clamp-2 mb-4" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${opp.description}</p>
                        </div>
                        <div class="mt-4 pt-4 border-t" style="border-top: 1px solid var(--border)">
                            <a href="opportunity-details.html?id=${opp.id}" class="btn btn-outline w-full justify-center">View Details</a>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = `<p class="text-red-500">Error loading opportunities: ${error.message}</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadOpportunities);
        document.getElementById('searchBtn').addEventListener('click', loadOpportunities);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadOpportunities();
        });
    </script>
</body>
</html>
